name: Release

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.2.0)'
        required: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_build: ${{ steps.version.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version bump
        id: bump
        run: |
          MSG=$(head -1 <<< "${{ github.event.head_commit.message }}")
          if echo "$MSG" | grep -qE '^feat(\(.+\))?:'; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif echo "$MSG" | grep -qE '^add(\(.+\))?:'; then
            echo "type=minor" >> $GITHUB_OUTPUT
          elif echo "$MSG" | grep -qE '^fix(\(.+\))?:'; then
            echo "type=patch" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=manual" >> $GITHUB_OUTPUT
          else
            echo "type=none" >> $GITHUB_OUTPUT
          fi

      - name: Get latest tag
        id: tag
        run: |
          TAG=$(git tag --sort=-v:refname | head -n1 || echo "v0.0.0")
          echo "current=$TAG" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: version
        run: |
          if [ "${{ steps.bump.outputs.type }}" = "none" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            CURRENT="${{ steps.tag.outputs.current }}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT#v}"
            case "${{ steps.bump.outputs.type }}" in
              major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
              patch) PATCH=$((PATCH + 1)) ;;
            esac
            echo "tag=v${MAJOR}.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
          fi

      - name: Create release
        if: steps.version.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body: ${{ github.event.head_commit.message }}
          draft: false
          prerelease: false

  build:
    needs: release
    if: needs.release.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: proto-x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset: proto-aarch64-unknown-linux-gnu
            cross_gcc: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: proto-x86_64-apple-darwin
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: proto-aarch64-apple-darwin

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: proto-x86_64-pc-windows-msvc.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross gcc (Linux aarch64)
        if: matrix.cross_gcc
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload binary
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BINARY="target/${{ matrix.target }}/release/proto"
          ASSET="${{ matrix.asset }}"
          if [ "${{ runner.os }}" = "Windows" ]; then BINARY="${BINARY}.exe"; fi
          mkdir -p dist
          cp "$BINARY" "dist/$ASSET"
          sha256sum "dist/$ASSET" > "dist/$ASSET.sha256"
          gh release upload "${{ needs.release.outputs.tag }}" "dist/$ASSET" "dist/$ASSET.sha256" --repo ${{ github.repository }} --clobber
        shell: bash