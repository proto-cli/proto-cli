[package]
name = "proto"
version = "0.1.0"
edition = "2021"
description = "Your friendly protogen CLI companion"
license = "MIT"
repository = "https://github.com/foxy/proto"

[dependencies]
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
indicatif = "0.17"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
sysinfo = "0.31"
dirs = "5"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
